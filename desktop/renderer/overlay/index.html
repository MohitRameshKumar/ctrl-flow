<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Cadence leader</title>
    <style>
      /* The window itself is transparent; this panel is the only visible thing. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #f5f5f5;
        -webkit-user-select: none;
        user-select: none;
      }
      .box {
        margin: 10px;
        background: rgba(24, 24, 27, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      }
      .title {
        font-weight: 600;
        margin-bottom: 8px;
        opacity: 0.75;
        font-size: 12px;
        letter-spacing: 0.01em;
      }
      .row {
        display: flex;
        gap: 10px;
        padding: 4px 2px;
        align-items: baseline;
        border-radius: 5px;
      }
      .row.sel {
        background: rgba(138, 180, 248, 0.18);
      }
      .row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      kbd {
        min-width: 20px;
        text-align: center;
        background: #3f3f46;
        border-radius: 4px;
        padding: 1px 6px;
        font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        flex: none;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 6px 9px;
        border-radius: 7px;
        border: 1px solid #52525b;
        background: #27272a;
        color: #fff;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #8ab4f8;
      }
      .hint {
        opacity: 0.5;
        font-size: 11px;
        margin-top: 8px;
      }
      .empty {
        opacity: 0.5;
        padding: 4px 2px;
      }
    </style>
  </head>
  <body>
    <div class="box" id="box"></div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
